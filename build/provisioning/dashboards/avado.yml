apiVersion: 1

providers:
  - name: AVADO
    orgId: 1
    folder: AVADO
    folderUid: avado
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      # Baked into the image (not on the data volume), so dashboards are
      # updated together with the package.
      path: /var/lib/grafana-dashboards
