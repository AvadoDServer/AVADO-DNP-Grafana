# Grafana settings for AVADO. Anything not set here uses Grafana's defaults
# (conf/defaults.ini) and can be overridden with GF_<SECTION>_<KEY> env vars.

[paths]
data = /var/lib/grafana
provisioning = /etc/grafana/provisioning

[server]
http_port = 3000
root_url = http://grafana.my.ava.do:3000/

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
# Everyone on the AVADO network can look at the dashboards; log in as admin
# (see README) to edit.
enabled = true
org_name = Main Org.
org_role = Viewer

[dashboards]
default_home_dashboard_path = /var/lib/grafana-dashboards/host.json
