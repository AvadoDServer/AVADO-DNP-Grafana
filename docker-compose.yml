version: '3.4'
services:
  grafana.avado.dappnode.eth:
    build: ./build
    image: 'grafana.avado.dappnode.eth:0.0.4'
    environment:
      - GF_SERVER_HTTP_PORT=3000
      - GF_SECURITY_ADMIN_PASSWORD=
    restart: always
    volumes:
      - 'data:/var/lib/grafana'
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
volumes:
  data: {}
